<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Video Edge Background Fullscreen</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            height: 100%;
            width: 100%;
        }

        /* Canvas edge chiếm toàn màn hình */
        #edgeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            object-fit: cover;
            filter: blur(3px);
        }

        /* Video chính ở giữa như cửa sổ */
        #videoMain {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 640px;
            height: 360px;
            z-index: 2;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- Nền toàn màn hình là canvas -->
    <canvas id="edgeCanvas"></canvas>

    <!-- Video chính (cửa sổ nổi) -->
    <video id="videoMain" controls autoplay muted loop>
        <source src="con_cho.mp4" type="video/mp4" />
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById("videoMain");
        const canvas = document.getElementById("edgeCanvas");
        const ctx = canvas.getContext("2d");

        function applyEdgeDetection(imageData) {
            const width = imageData.width;
            const height = imageData.height;
            const src = imageData.data;
            const dst = new Uint8ClampedArray(src.length);

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const i = (y * width + x) * 4;

                    const gx =
                        -src[((y - 1) * width + (x - 1)) * 4] -
                        2 * src[(y * width + (x - 1)) * 4] -
                        src[((y + 1) * width + (x - 1)) * 4] +
                        src[((y - 1) * width + (x + 1)) * 4] +
                        2 * src[(y * width + (x + 1)) * 4] +
                        src[((y + 1) * width + (x + 1)) * 4];

                    const gy =
                        -src[((y - 1) * width + (x - 1)) * 4] -
                        2 * src[((y - 1) * width + x) * 4] -
                        src[((y - 1) * width + (x + 1)) * 4] +
                        src[((y + 1) * width + (x - 1)) * 4] +
                        2 * src[((y + 1) * width + x) * 4] +
                        src[((y + 1) * width + (x + 1)) * 4];

                    const mag = Math.sqrt(gx * gx + gy * gy);
                    dst[i] = dst[i + 1] = dst[i + 2] = mag;
                    dst[i + 3] = 255;
                }
            }

            for (let i = 0; i < dst.length; i++) {
                src[i] = dst[i];
            }

            return imageData;
        }

        video.addEventListener("play", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            function draw() {
                if (video.paused || video.ended) return;

                // Tạo canvas tạm để lấy đúng khung hình gốc
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                const tempCtx = tempCanvas.getContext('2d');

                // Vẽ frame gốc từ video
                tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
                let frame = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                frame = applyEdgeDetection(frame);

                // Vẽ lên canvas chính đã resize theo màn hình
                // Phóng frame đã xử lý ra toàn màn hình
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const edgeImage = new ImageData(frame.data, frame.width, frame.height);
                const tempCanvas2 = document.createElement('canvas');
                tempCanvas2.width = frame.width;
                tempCanvas2.height = frame.height;
                const tempCtx2 = tempCanvas2.getContext('2d');
                tempCtx2.putImageData(edgeImage, 0, 0);
                ctx.drawImage(tempCanvas2, 0, 0, canvas.width, canvas.height);

                requestAnimationFrame(draw);
            }

            draw();
        });
    </script>

</body>

</html>
